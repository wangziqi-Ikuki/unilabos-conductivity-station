[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "YB-SSE-Labpackage"
version = "0.1.0"
description = "Uni-Lab-OS external device package for the YB solid-state electrolyte laboratory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = [
    "unilabos",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["yb_sse_devices*"]
