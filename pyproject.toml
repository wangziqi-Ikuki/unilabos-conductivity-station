[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unilabos-conductivity-station"
version = "0.1.0"
description = "Uni-Lab-OS external driver package for the conductivity workstation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = [
    "unilabos",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["conductivity_station*"]
